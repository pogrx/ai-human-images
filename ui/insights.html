<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detector Insights</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fcfcfb; --surface-2: #eef0f3; --border: #dde1e6;
    --text: #0b0b0b; --text-2: #52514e; --muted: #6b6a66; --grid: #e6e6e3; --accent: #3b5bdb;
    --s-ai: #eb6834; --s-real: #1baf7a; --threshold: #8a8984;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101113; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --grid: #2c2c2a; --accent: #7c95f5;
      --s-ai: #d95926; --s-real: #199e70; --threshold: #77766f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  nav { display: flex; gap: 16px; font-size: 14px; margin-bottom: 18px; }
  nav a { color: var(--text-2); text-decoration: none; padding-bottom: 2px; }
  nav a[aria-current] { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  .lede { color: var(--text-2); margin: 0 0 20px; max-width: 760px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 18px; margin-top: 16px; box-shadow: var(--shadow); }
  section > p { margin: 0 0 12px; color: var(--text-2); max-width: 820px; }
  .finding { margin: 12px 0 0; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; color: var(--text); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .num { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .lbl { color: var(--text-2); font-size: 14px; }
  .multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px 20px; }
  .chart h3 { font-size: 14px; margin: 6px 0 0; }
  .chart .unit { font-size: 12px; color: var(--muted); }
  .chart { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { font: 11px system-ui, sans-serif; fill: var(--muted); }
  svg .lbl-strong { fill: var(--text); font-weight: 600; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-line { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .key-dash { width: 18px; border-top: 2px dashed var(--threshold); display: inline-block; }
  .key-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.15);
         white-space: nowrap; z-index: 5; display: none; }
  .tip b { font-weight: 600; }
  .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .prints { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .prints figure { margin: 0; }
  .prints img { width: 100%; aspect-ratio: 1; display: block; border-radius: 8px; border: 1px solid var(--border); image-rendering: auto; }
  .prints figcaption { font-size: 13px; margin-top: 4px; color: var(--text-2); }
  .prints figcaption b { color: var(--text); }
  details { margin-top: 10px; font-size: 13px; color: var(--text-2); }
  summary { cursor: pointer; }
  table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  .warn { background: color-mix(in srgb, #fab219 18%, transparent); border: 1px solid color-mix(in srgb, #fab219 50%, transparent);
          border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--text-2); }
  code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  ul.caveats { margin: 0; padding-left: 20px; color: var(--text-2); max-width: 840px; }
  ul.caveats li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <nav><a href="/">Test images</a><a href="/insights" aria-current="page">Insights</a></nav>
  <h1>What the detector looks at</h1>
  <p class="lede" id="lede">Experiments on held-out images the model never trained on.</p>
  <div id="root"><p class="empty">Loading results…</p></div>
</main>
<div class="tip" id="tip"></div>

<script>
const tip = document.getElementById("tip");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const pct = (x) => Math.round(x * 100) + "%";
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
function showTip(evt, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, hgt = tip.offsetHeight;
  let x = evt.pageX + pad, y = evt.pageY - hgt - pad;
  if (x + w > window.scrollX + document.documentElement.clientWidth - 8) x = evt.pageX - w - pad;
  if (y < window.scrollY + 8) y = evt.pageY + pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };
const swatch = (color) => `<span class="sw" style="background:${color}"></span>`;

/* Charts are drawn at their container's real pixel width (so text stays 11-12px) and redrawn on resize. */
const mounted = [];
function mount(draw) {
  const box = h("div", { class: "plot" });
  mounted.push({ box, draw });
  return box;
}
function drawAll() {
  for (const { box, draw } of mounted) {
    const w = Math.max(260, Math.round(box.clientWidth));
    if (box.dataset.w === String(w)) continue;
    box.dataset.w = w;
    box.replaceChildren(draw(w));
  }
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawAll, 120); });

function legend(items) {
  return h("div", { class: "legend" }, ...items.map(([label, kind, color]) => {
    const key = kind === "dash" ? h("i", { class: "key-dash" })
      : h("i", { class: kind === "box" ? "key-box" : "key-line", style: `background:${color}` });
    return h("span", {}, key, label);
  }));
}

function table(headers, rows) {
  const t = h("table");
  t.append(h("tr", {}, ...headers.map((x) => h("th", {}, x))));
  rows.forEach((r) => t.append(h("tr", {}, ...r.map((x) => h("td", {}, String(x))))));
  return h("details", {}, h("summary", {}, "Show as table"), t);
}

/* Line chart. xs: x values (numeric) or labels (ordinal = evenly spaced). series: [{name, color, ys, label}] */
function lineChart({ xs, ordinal, series, yMin = 0, yMax = 1, yTicks, refY, refLabel, xFmt = String, yFmt = pct,
                     xTitle, height = 220, width = 420, xTickValues }) {
  const W = width, H = height, m = { l: 40, r: 14, t: 12, b: 38 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const xMin = ordinal ? 0 : Math.min(...xs), xMax = ordinal ? xs.length - 1 : Math.max(...xs);
  const X = (i) => m.l + ((ordinal ? i : xs[i]) - xMin) / (xMax - xMin || 1) * pw;
  const Y = (v) => m.t + (1 - (v - yMin) / (yMax - yMin)) * ph;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const grid = css("--grid");
  (yTicks || [0, 0.25, 0.5, 0.75, 1]).forEach((t) => {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: grid, "stroke-width": 1 }));
    svg.append(svgEl("text", { x: m.l - 6, y: Y(t) + 4, "text-anchor": "end" }, yFmt(t)));
  });
  if (ordinal) {
    xs.forEach((v, i) => svg.append(svgEl("text", { x: X(i), y: H - m.b + 16, "text-anchor": "middle" }, xFmt(v))));
  } else {
    const XV = (v) => m.l + (v - xMin) / (xMax - xMin || 1) * pw;
    (xTickValues || [xMin, xMax]).forEach((v) =>
      svg.append(svgEl("text", { x: XV(v), y: H - m.b + 16, "text-anchor": "middle" }, xFmt(v))));
  }
  if (xTitle) svg.append(svgEl("text", { x: m.l + pw / 2, y: H - 4, "text-anchor": "middle" }, xTitle));
  if (refY != null) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: Y(refY), y2: Y(refY), stroke: css("--threshold"),
                               "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
    if (refLabel) svg.append(svgEl("text", { x: W - m.r, y: Y(refY) - 5, "text-anchor": "end" }, refLabel));
  }
  const surface = css("--surface");
  series.forEach((s) => {
    const d = s.ys.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    svg.append(svgEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (ordinal) s.ys.forEach((v, i) => svg.append(svgEl("circle", { cx: X(i), cy: Y(v), r: 4, fill: s.color, stroke: surface, "stroke-width": 2 })));
    if (s.label) svg.append(svgEl("text", { x: X(0) + 8, y: Y(s.ys[0]) + (s.labelBelow ? 16 : -9), class: "lbl-strong" }, s.label));
  });
  // hover layer: crosshair + tooltip at the nearest x
  const cross = svgEl("line", { y1: m.t, y2: m.t + ph, stroke: css("--text-2"), "stroke-width": 1, opacity: 0 });
  const dots = series.map((s) => svgEl("circle", { r: 5, fill: s.color, stroke: surface, "stroke-width": 2, opacity: 0 }));
  svg.append(cross, ...dots);
  const hit = svgEl("rect", { x: m.l - 10, y: 0, width: pw + 20, height: H, fill: "transparent" });
  hit.addEventListener("mousemove", (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    let best = 0;
    xs.forEach((_, i) => { if (Math.abs(X(i) - p.x) < Math.abs(X(best) - p.x)) best = i; });
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best)); cross.setAttribute("opacity", 0.5);
    series.forEach((s, k) => { dots[k].setAttribute("cx", X(best)); dots[k].setAttribute("cy", Y(s.ys[best])); dots[k].setAttribute("opacity", 1); });
    showTip(e, `<b>${xTitle ? xTitle + ": " : ""}${xFmt(xs[best])}</b><br>` +
      series.map((s) => `${swatch(s.color)}${s.name}: <b>${yFmt(s.ys[best])}</b>`).join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { hideTip(); cross.setAttribute("opacity", 0); dots.forEach((d) => d.setAttribute("opacity", 0)); });
  svg.append(hit);
  return svg;
}

/* Horizontal bar chart (values 0..1). rows: [{label, value, color, note, tip}] */
function barChart(rows, { refX, refLabel, width = 640 } = {}) {
  const W = width, rowH = 34, m = { l: Math.min(200, W * 0.42), r: 70, t: 14, b: 26 }, H = m.t + rows.length * rowH + m.b;
  const pw = W - m.l - m.r, X = (v) => m.l + v * pw;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const grid = css("--grid");
  [0, 0.25, 0.5, 0.75, 1].forEach((t) => {
    svg.append(svgEl("line", { x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, stroke: grid }));
    svg.append(svgEl("text", { x: X(t), y: H - m.b + 16, "text-anchor": "middle" }, pct(t)));
  });
  rows.forEach((r, i) => {
    const y = m.t + i * rowH, bh = 18, by = y + (rowH - bh) / 2;
    const w = Math.max(2, X(r.value) - m.l);
    svg.append(svgEl("text", { x: m.l - 10, y: by + 13, "text-anchor": "end", class: "lbl-strong" }, r.label));
    // bar with 4px rounded data end, square at the baseline
    const rr = Math.min(4, w);
    svg.append(svgEl("path", { d: `M${m.l},${by}h${w - rr}a${rr},${rr} 0 0 1 ${rr},${rr}v${bh - 2 * rr}a${rr},${rr} 0 0 1 -${rr},${rr}h-${w - rr}z`, fill: r.color }));
    svg.append(svgEl("text", { x: m.l + w + 6, y: by + 13 }, r.note ?? pct(r.value)));
    const hit = svgEl("rect", { x: 0, y, width: W, height: rowH, fill: "transparent" });
    hit.addEventListener("mousemove", (e) => showTip(e, r.tip));
    hit.addEventListener("mouseleave", hideTip);
    svg.append(hit);
  });
  if (refX != null) {
    svg.append(svgEl("line", { x1: X(refX), x2: X(refX), y1: m.t - 4, y2: H - m.b, stroke: css("--threshold"), "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
    if (refLabel) svg.append(svgEl("text", { x: X(refX) + 4, y: m.t + 2 }, refLabel));
  }
  return svg;
}

async function load() {
  const root = document.getElementById("root");
  let d;
  try {
    const res = await fetch("/api/insights");
    d = await res.json();
    if (!res.ok) throw new Error(d.error);
  } catch (err) {
    root.innerHTML = "";
    root.append(h("p", { class: "empty" }, err.message || "Couldn't load results.", h("br"),
      "Run ", h("code", {}, ".\\.venv\\Scripts\\python.exe analyze.py"), " and reload this page."));
    return;
  }
  const AI = css("--s-ai"), REAL = css("--s-real");
  root.innerHTML = "";
  document.getElementById("lede").textContent =
    `Experiments on ${d.held_out.ai + d.held_out.real} held-out images the model never trained on ` +
    `(${d.held_out.ai} AI, ${d.held_out.real} real). Model: ${d.model.arch}, epoch ${d.model.epoch}. Measured ${d.created}.`;
  if (d.stale) root.append(h("div", { class: "warn" },
    "The model has been retrained since these results were measured. Run analyze.py again to refresh them."));

  // headline tiles
  const blur1 = d.damage.blur.rows.find((r) => r.level === 1);
  const base = d.damage.blur.rows[0];
  const swapRA = d.swap.find((s) => s.content === "real" && s.detail === "ai");
  const finest = d.energy.ai_vs_real.slice(-Math.floor(d.energy.ai_vs_real.length / 4));
  const finestRatio = finest.reduce((a, b) => a + b, 0) / finest.length;
  const tiles = h("div", { class: "tiles" });
  [[pct(base.acc) + " → " + pct(blur1.acc), "accuracy after a 1-pixel blur (50% is a coin flip)"],
   [pct(swapRA.flag_ai), "of real photos flagged as AI once given an AI image's fine detail"],
   [pct(finestRatio), "as much finest-scale detail in AI images as in real photos"]]
    .forEach(([num, lbl]) => tiles.append(h("div", { class: "tile" }, h("div", { class: "num" }, num), h("div", { class: "lbl" }, lbl))));
  root.append(tiles);

  // 1. damage tests
  const s1 = h("section", {}, h("h2", {}, "1. What happens when fine detail is damaged"),
    h("p", {}, "Each held-out image was blurred, shrunk and re-enlarged, re-compressed, or given extra noise, at increasing strength. " +
      "The lines show the average AI score for AI images and for real photos. Hover for exact values."));
  s1.append(legend([["AI images", "line", AI], ["Real photos", "line", REAL], ["50% decision line", "dash"]]));
  const mult = h("div", { class: "multiples" });
  const fmts = { blur: (v) => v === 0 ? "none" : v + " px", rescale: (v) => v + "%", jpeg: (v) => v === 100 ? "orig." : "q" + v, noise: (v) => v === 0 ? "none" : "±" + v };
  for (const [key, t] of Object.entries(d.damage)) {
    const c = h("div", { class: "chart" }, h("h3", {}, t.label));
    c.append(mount((w) => lineChart({ xs: t.rows.map((r) => r.level), ordinal: true, xFmt: fmts[key], xTitle: t.unit,
      refY: 0.5, width: w,
      series: [{ name: "AI images", color: AI, ys: t.rows.map((r) => r.mean_ai), label: "AI" },
               { name: "Real photos", color: REAL, ys: t.rows.map((r) => r.mean_real), label: "Real", labelBelow: true }] })));
    mult.append(c);
  }
  s1.append(mult);
  s1.append(h("p", { class: "finding" },
    "AI images keep scoring high no matter what. Real photos are the ones that move: as soon as their finest detail is blurred or scaled away, " +
    "the model starts calling them AI. In other words, the model has learned that real photos carry crisp pixel-level detail and noise, " +
    "and treats a lack of it as a sign of AI. Added noise barely matters until it gets strong, and JPEG compression erodes the signal gradually."));
  const rows1 = [];
  for (const t of Object.values(d.damage)) t.rows.forEach((r) => rows1.push([t.label, r.level, pct(r.mean_ai), pct(r.mean_real), pct(r.acc), r.auc.toFixed(3)]));
  s1.append(table(["Test", "Strength", "Avg score: AI", "Avg score: real", "Accuracy", "AUC"], rows1));
  root.append(s1);

  // 2. detail swap
  const s2 = h("section", {}, h("h2", {}, "2. Content or detail? Swapping them"),
    h("p", {}, "Each image was split into its coarse content (a blurred copy: shapes, colours, what the picture shows) and its fine detail " +
      "(what the blur removed). Content from one image was combined with fine detail from another. Bars are coloured by where the fine detail came from."));
  s2.append(legend([["Fine detail from an AI image", "box", AI], ["Fine detail from a real photo", "box", REAL]]));
  s2.append(mount((w) => barChart(d.swap.map((s) => ({
    label: s.name, value: s.mean, color: s.detail === "ai" ? AI : REAL, note: `${pct(s.mean)} avg`,
    tip: `<b>${s.name}</b><br>Average AI score: <b>${pct(s.mean)}</b><br>Flagged as AI: <b>${pct(s.flag_ai)}</b> of ${s.n}`,
  })), { refX: 0.5, refLabel: "50%", width: w })));
  s2.append(h("p", { class: "finding" },
    "The score follows the fine detail, not the content. A real photo given an AI image's fine detail is flagged as AI " + pct(swapRA.flag_ai) +
    " of the time, while an AI image given real fine detail mostly passes as real. The model is essentially ignoring what the picture shows."));
  s2.append(table(["Image", "Avg score", "Flagged as AI", "Pairs"], d.swap.map((s) => [s.name, pct(s.mean), pct(s.flag_ai), s.n])));
  root.append(s2);

  // 3. energy by frequency
  const s3 = h("section", {}, h("h2", {}, "3. How much fine detail AI images have"),
    h("p", {}, "Detail energy at each scale, from coarse (left) to the finest pixel-to-pixel detail (right), for AI images relative to real photos. " +
      "100% means the same amount as real photos."));
  const e = d.energy;
  const yMaxE = Math.max(1.2, Math.ceil(Math.max(...e.ai_vs_real) * 5) / 5);
  const ticksE = []; for (let t = 0; t <= yMaxE + 1e-9; t += 0.25) ticksE.push(+t.toFixed(2));
  s3.append(h("div", { class: "chart" }, mount((w) => lineChart({ xs: e.freq, series: [{ name: "AI ÷ real", color: AI, ys: e.ai_vs_real }],
    yMax: yMaxE, yTicks: ticksE, refY: 1, refLabel: "same as real", xTitle: "detail scale (0 = coarse, 1 = finest)",
    xFmt: (v) => v.toFixed(2), height: 260, width: w, xTickValues: [0.25, 0.5, 0.75, 1] }))));
  s3.append(h("p", { class: "finding" },
    `At the finest scales, AI images have only about ${pct(finestRatio)} of the detail energy of real photos. ` +
    "Image generators produce smoother pixels than a camera does, and that gap is exactly what sections 1 and 2 show the model relying on."));
  root.append(s3);

  // 4. fingerprints
  const s4 = h("section", {}, h("h2", {}, "4. Frequency fingerprints"),
    h("p", {}, "Each square is the average frequency spectrum of one group's fine detail. The centre is coarse detail and the edges are the finest; " +
      "darker means more energy. Regular dots or lines are repeating patterns that a generator stamps into every image. Each square is scaled on its own, so compare shapes, not overall darkness."));
  const grid4 = h("div", { class: "prints" });
  d.fingerprints.forEach((f) => grid4.append(h("figure", {},
    h("img", { src: f.png, alt: `Frequency fingerprint of ${f.source}` }),
    h("figcaption", {}, h("b", {}, f.source === "Real" ? "Real photos" : f.source), ` · ${f.n} images`))));
  s4.append(grid4);
  s4.append(h("p", { class: "finding" },
    "Real photos show a soft, even spread with faint streaks from edges in natural scenes. SD 1.5 and Wukong look almost identical, which fits: " +
    "Wukong is based on Stable Diffusion's design, likely including its image decoder. VQDM stands out with a regular grid of dots, " +
    "likely because it assembles images from fixed-size tiles. These patterns are what lets a detector tell generators apart, " +
    "although this model mainly relies on the overall smoothness shown in section 3."));
  root.append(s4);

  // 5. per-generator
  const s5 = h("section", {}, h("h2", {}, "5. Results by source"),
    h("p", {}, "Share of held-out images flagged as AI (score of 50% or more). For AI generators higher is better; for real photos it is the false-alarm rate."));
  s5.append(legend([["AI generator", "box", AI], ["Real photos", "box", REAL]]));
  s5.append(mount((w) => barChart(d.generators.map((g) => ({
    label: g.source === "Real" ? "Real photos" : g.source, value: g.flag_ai, color: g.is_ai ? AI : REAL,
    note: `${pct(g.flag_ai)} of ${g.n}`,
    tip: `<b>${g.source === "Real" ? "Real photos" : g.source}</b><br>Flagged as AI: <b>${pct(g.flag_ai)}</b> of ${g.n}<br>Average score: <b>${pct(g.mean)}</b>`,
  })), { width: w })));
  s5.append(table(["Source", "Images", "Flagged as AI", "Avg score", "Median score"],
    d.generators.map((g) => [g.source, g.n, pct(g.flag_ai), pct(g.mean), pct(g.median)])));
  root.append(s5);

  // caveats
  root.append(h("section", {}, h("h2", {}, "What this means in practice"),
    h("ul", { class: "caveats" },
      h("li", {}, "Real photos that were blurred, resized down, screenshotted or heavily compressed are likely to be flagged as AI, because they have lost the fine detail the model looks for."),
      h("li", {}, "An AI image with grain or noise added afterwards may pass as real."),
      h("li", {}, "The real photos in this dataset are ImageNet pictures that were already shrunk before collection, which sharpens their per-pixel detail. Photos straight from a phone are softer at the pixel level and may score higher than these results suggest."),
      h("li", {}, "Training with more blur, resizing and compression augmentation, and with real photos from many sources, would push the model towards more robust cues."))));
  drawAll();
}
load();
</script>
